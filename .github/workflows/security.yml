# Garnet — supply-chain security gate.
#
# Runs `cargo audit`, `cargo-deny` (advisories + licenses + bans +
# sources), and emits a CycloneDX SBOM as a workflow artifact on every
# push and PR. The weekly cron makes sure new RUSTSEC advisories surface
# even when no code is moving — a quiet repo with a known-vulnerable dep
# is the exact failure mode this catches.
#
# Coverage note (P5 hygiene): the root workspace lock is NOT the whole
# dependency surface. Two lockfiles live outside the workspace and are
# scanned explicitly below: the Tauri Studio app
# (apps/garnet-studio/src-tauri/Cargo.lock — the wry/tao webview stack,
# the highest-CVE-velocity shipped surface) and the parser fuzz crate
# (garnet-parser-v0.3/fuzz/Cargo.lock). Advisory scans cover all three
# locks; license/bans/sources policy and the canonical SBOM stay scoped
# to the root workspace (the shipped garnet binary).
#
# This is additive to `ci.yml` (build/test) and `linux-packages.yml`
# (.deb/.rpm release path); the three workflows are independent.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 07:00 UTC every Monday — early enough that any new RUSTSEC entry
    # from the prior week's Friday/weekend disclosures fires before
    # business hours.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────────────────────────────────────────────────
  # cargo-audit: direct RUSTSEC advisory scan of Cargo.lock.
  # ───────────────────────────────────────────────────────────────────
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-audit-
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force
      - name: Run cargo audit (root workspace)
        run: cargo audit
      - name: Run cargo audit (Tauri Studio lock)
        run: cargo audit --file apps/garnet-studio/src-tauri/Cargo.lock
      - name: Run cargo audit (parser fuzz lock)
        run: cargo audit --file garnet-parser-v0.3/fuzz/Cargo.lock

  # ───────────────────────────────────────────────────────────────────
  # cargo-deny: enforces deny.toml across the whole graph.
  # ───────────────────────────────────────────────────────────────────
  cargo-deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features
      # Advisory-only pass over the workspace-excluded Tauri Studio graph.
      # Policy: the COMMITTED apps/garnet-studio/src-tauri/deny.toml —
      # vulnerabilities deny; the documented unmaintained-structural-to-Tauri
      # ignore list lives there with per-advisory reasons. Licenses/bans/
      # sources stay root-scoped (Studio is not the shipped garnet binary).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories
          manifest-path: apps/garnet-studio/src-tauri/Cargo.toml

  # ───────────────────────────────────────────────────────────────────
  # CycloneDX SBOM — uploaded as a workflow artifact for every run.
  # On tagged releases the linux-packages workflow can pick this up
  # (or regenerate) for inclusion in the release assets.
  # ───────────────────────────────────────────────────────────────────
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-sbom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sbom-
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --force
      - name: Generate SBOM (workspace)
        run: cargo cyclonedx --all --format json
      - name: Generate SBOM (Tauri Studio app)
        run: cargo cyclonedx --manifest-path apps/garnet-studio/src-tauri/Cargo.toml --format json
      - name: Collect SBOMs
        run: |
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './sbom/*' -exec cp {} sbom/ \;
          ls -la sbom/
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: garnet-sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90
