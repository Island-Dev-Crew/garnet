# Garnet — core continuous integration.
#
# Runs the three release-blocking gates (format, lint, test) on every push
# and pull request. The Linux packaging workflow (linux-packages.yml) covers
# the .deb / .rpm build path; this one covers the Rust workspace itself
# across the three supported tier-1 host platforms.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Agent documentation contracts — validates the AGENTS.md hierarchy
  # that agents use as repo-local procedural memory.
  # ───────────────────────────────────────────────────────────────────
  agent-contracts:
    name: agent documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python3 scripts/test_check_dogfood_pr_body.py
      - run: python3 scripts/test_check_agent_contracts.py
      - run: python3 scripts/test_github_actions_node24_readiness.py
      - run: python3 scripts/test_garnet_windows_linux_studio_status.py
      - run: python3 scripts/test_garnet_windows_linux_studio_shell.py
      - run: python3 scripts/test_check_determinism_no_llm.py
      - run: python3 scripts/test_garnet_build_proof.py
      - run: python3 scripts/test_garnet_proof_matrix.py
      - run: python3 scripts/test_garnet_pr_review_wedge.py
      - run: python3 scripts/test_garnet_v0_8_beta_gate.py
      - run: python3 scripts/test_garnet_signed_release_lanes.py
      - run: python3 scripts/test_garnet_install_readme_check.py
      - run: python3 scripts/test_garnet_tree_sitter_check.py
      - run: python3 scripts/test_garnet_vscode_publish_readiness.py
      - run: python3 scripts/test_garnet_wasm_readiness.py
      - run: python3 scripts/test_garnet_playground_readiness.py
      - run: python3 scripts/test_garnet_idiomatic_corpus.py
      - run: python3 scripts/test_garnet_benchmark_campaign.py
      - run: python3 scripts/test_garnet_fuzz_campaign.py
      - run: python3 scripts/test_garnet_v0_8_0_release_readiness.py
      - run: python3 scripts/test_garnet_llm_suggest_readiness.py
      - run: python3 scripts/test_garnet_version_map_check.py
      - run: python3 scripts/test_garnet_paper_vi_exp3_status.py
      - run: python3 scripts/test_garnet_self_hosted_parser_seed_status.py
      - run: python3 scripts/test_garnet_vm_interp_parity.py
      - run: python3 scripts/test_garnet_safe_subset_status.py
      - run: python3 scripts/test_garnet_formal_verification_feasibility.py
      - run: python3 scripts/test_garnet_stdlib_promotion_status.py
      - run: python3 scripts/test_garnet_external_package_pilot_status.py
      - run: python3 scripts/test_garnet_governance_status.py
      - run: python3 scripts/test_garnet_positioning_status.py
      - run: python3 scripts/test_garnet_v0_8_0_cut_readiness.py
      - run: python3 scripts/test_garnet_windows_audit_status.py
      - run: python3 scripts/test_garnet_garnet_ext_discovery_status.py
      - run: python3 scripts/test_garnet_seal_determinism_status.py
      - run: python3 scripts/test_garnet_interp_stack_status.py
      - run: python3 scripts/test_garnet_bounded_enforcement_status.py
      - run: python3 scripts/test_garnet_caps_enforcement_status.py
      - run: python3 scripts/test_garnet_vm_interp_enforcement_parity_status.py
      - run: python3 scripts/test_garnet_release_truth_status.py
      - run: python3 scripts/check_determinism_no_llm.py
      - run: python3 scripts/check-agent-contracts.py
      # S47: gate cross-OS build coverage — fails if ci.yml stops testing all
      # three target OSes (Windows/Linux/macOS) with `cargo test --workspace`.
      - run: python3 scripts/garnet_build_proof.py --gate
      # S48: gate the 12-domain / 7-novel evidence matrix — fails if a domain
      # example or a contribution evidence anchor disappears.
      - run: python3 scripts/garnet_proof_matrix.py --gate
      # S50: v0.8 beta gate — fails unless the S41-S49 hardening band is merged
      # and the band's sub-gates still hold. A checkpoint, not a release.
      - run: python3 scripts/garnet_v0_8_beta_gate.py --gate
      # S51: signed-release-lanes — fails if the ACTIVE lane (program-manifest
      # signing) is no longer wired in CI. Lanes 2/3 are deferred/partial by design.
      - run: python3 scripts/garnet_signed_release_lanes.py --gate
      # S52: install/readme consistency — fails if the README one-line install
      # command or URL drifts from installer/sh.garnet-lang.org/install.sh.
      - run: python3 scripts/garnet_install_readme_check.py --gate
      # S53: tree-sitter grammar structural check — fails if grammar.js loses a
      # core rule (when node is available; structural only, not compiled).
      - run: python3 scripts/garnet_tree_sitter_check.py --gate
      # S54: VS Code publish readiness — fails if the extension manifest loses a
      # marketplace-required field/file. The credentialed publish stays deferred.
      - run: python3 scripts/garnet_vscode_publish_readiness.py --gate
      # S55: wasm hello-world readiness — guards the owned bits (hello example +
      # target doc); the absent wasm toolchain is an honest deferral, not gated.
      - run: python3 scripts/garnet_wasm_readiness.py --gate
      # S56: playground gallery — guards the static gallery's structure AND that
      # the page keeps its honesty markers (no fake-editor claim).
      - run: python3 scripts/garnet_playground_readiness.py --gate
      # S58: benchmark campaign — fails if a declared Criterion bench file or its
      # Cargo [[bench]] entry disappears. No measurements are run.
      - run: python3 scripts/garnet_benchmark_campaign.py --gate
      # S59: fuzz campaign — fails if the parser fuzz target, its Cargo [[bin]],
      # the nightly workflow wiring, or the seed corpus disappears. Fuzzer not run.
      - run: python3 scripts/garnet_fuzz_campaign.py --gate
      # S60: v0.8.0 release-readiness — aggregates both v0.8 bands + every
      # anti-rot sub-gate. Evidence for the tag decision; does NOT cut a tag.
      - run: python3 scripts/garnet_v0_8_0_release_readiness.py --gate
      # S69: llm-suggest readiness — gates the rules tier (S10) is present; the
      # LLM tier is pending-infra and is NOT gated.
      - run: python3 scripts/garnet_llm_suggest_readiness.py --gate
      # S70: version-map source of truth — whole S30–S80 run = one v0.8.0 tag @
      # S80; S60/S70 are checkpoints. Guards docs only; cuts no tag.
      - run: python3 scripts/garnet_version_map_check.py --gate
      # S71: Paper VI Exp 3 — gates the harness ships + runs provider-free; the
      # provider-backed h₃a re-run is pending-infra and is NOT gated.
      - run: python3 scripts/garnet_paper_vi_exp3_status.py --gate
      # S72: self-hosted parser seed — static well-formedness gate here (this job
      # builds no compiler); the binary-backed check+run proof is in the
      # canonical-examples job below.
      - run: python3 scripts/garnet_self_hosted_parser_seed_status.py --gate --no-run
      # S73: VM/interpreter parity — static gate here (corpus present); the
      # binary-backed differential run is in the canonical-examples job below.
      - run: python3 scripts/garnet_vm_interp_parity.py --gate --no-run
      # S74: safe-subset spec — static anti-overclaim gate (spec present + its
      # "implemented today" claims grounded in source; proposed linear/effect
      # mode is NOT gated, it is explicitly not implemented).
      - run: python3 scripts/garnet_safe_subset_status.py --gate
      # S75: formal-verification feasibility — static gate (study present +
      # cited foundation real). No verification is run or implied; a study only.
      - run: python3 scripts/garnet_formal_verification_feasibility.py --gate
      # S76: stdlib promotion wave — gate that the core::* layer is Stable AND
      # std::* stays Experimental (proof the promotion was scoped, not blanket).
      - run: python3 scripts/garnet_stdlib_promotion_status.py --gate
      # S77: external package pilot — static gate (pilot test + registry infra +
      # slopguard + doc present). The binary-backed run is the cargo test matrix
      # (garnet-registry-stub/tests/external_package_pilot.rs).
      - run: python3 scripts/garnet_external_package_pilot_status.py --gate
      # S78: governance + RFC process — gate that GOVERNANCE.md + the RFC process
      # + RFC-0001 are present and RFC-0001 marks the OWASP/LF donation as
      # intent/draft (no foundation has adopted anything).
      - run: python3 scripts/garnet_governance_status.py --gate
      # S79: positioning reframe — gate that the positioning doc AND the landing
      # page both carry the integration thesis + diff-caps headline + precedent
      # concession (so messaging can't drift back to pillar-first marketing).
      - run: python3 scripts/garnet_positioning_status.py --gate
      # S80: v0.8.0 CUT readiness — aggregates the whole S30–S80 run (ledger
      # S31–S79 merged + release gate + 11 runway gates). Does NOT cut a tag;
      # cutting v0.8.0 is a release-truth decision reserved for Jon.
      - run: python3 scripts/garnet_v0_8_0_cut_readiness.py --gate
      # P0 (v0.8.1 runway): Windows audit burn-down — every open WIN-* finding
      # has an owning slice; the committed machine ledgers pin HEAD cc165e8.
      - run: python3 scripts/garnet_windows_audit_status.py --gate
      # S81: .GARNET discovery — the shared collector stays case-insensitive and
      # the capability surfaces route through it (closes WIN-S33/36/37/46).
      - run: python3 scripts/garnet_garnet_ext_discovery_status.py --gate
      # S82: seal source-hash determinism — .gitattributes LF pin + in-code EOL
      # normalization + documented contract (closes WIN-S38-001).
      - run: python3 scripts/garnet_seal_determinism_status.py --gate
      # S85: interpreter large-stack robustness — the interpreter runs on a
      # large-stack thread so deep recursion does not overflow (closes WIN-S73-001).
      - run: python3 scripts/garnet_interp_stack_status.py --gate
      # S89: @max_depth runtime enforcement — the interpreter traps deterministically
      # when a @max_depth(N) function recurses past N (the ONE enforced ceiling).
      - run: python3 scripts/garnet_bounded_enforcement_status.py --gate
      # S90: @caps host-authority enforcement — the interpreter traps when a managed
      # fn invokes a std::env/process/fs/log-to-file primitive whose cap is undeclared.
      - run: python3 scripts/garnet_caps_enforcement_status.py --gate
      # S101 (Stage V closeout): VM/interp enforcement-parity — the VM traps on
      # @max_depth (S99) and @caps (S100) identically to the interpreter; the
      # "VM enforces nothing" seam is closed for these two ceilings.
      - run: python3 scripts/garnet_vm_interp_enforcement_parity_status.py --gate
      # S83: post-tag release truth — v0.8.0 cut-by-Jon AND S80-PR-readiness-only
      # truths coexist (doc + CHANGELOG + ledger cut_record); closes WIN-S80-002.
      - run: python3 scripts/garnet_release_truth_status.py --gate

  # ───────────────────────────────────────────────────────────────────
  # Format check — fast, runs once on Linux. A failure here is the
  # cheapest possible signal to fix before paying for a build matrix.
  # ───────────────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    needs: agent-contracts
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────────────────────
  # Strict clippy across the workspace, all targets. -D warnings is set
  # via RUSTFLAGS above so promoted lints do not slip through.
  # ───────────────────────────────────────────────────────────────────
  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ───────────────────────────────────────────────────────────────────
  # Full workspace test matrix on the three supported platforms. Tests
  # gate on the cheaper fmt job so a broken format does not waste three
  # OS slots.
  # ───────────────────────────────────────────────────────────────────
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --no-fail-fast

  # ───────────────────────────────────────────────────────────────────
  # Canonical app dogfood — the 10 MVP examples are the public
  # application-level proof surface. They must parse, check, and run, not
  # merely exist as design drafts.
  # ───────────────────────────────────────────────────────────────────
  canonical-examples:
    name: canonical MVP examples
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-examples-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-examples-
      - run: cargo build -p garnet-cli
      - name: Parse, check, and run canonical MVP examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/mvp_*.garnet; do
            echo "::group::$file"
            target/debug/garnet parse "$file"
            target/debug/garnet check "$file"
            if [[ "$file" == *"_mismatch.garnet" ]]; then
              set +e
              target/debug/garnet run "$file" > /tmp/garnet-mvp.out 2> /tmp/garnet-mvp.err
              run_status=$?
              set -e
              if [[ "$run_status" -eq 0 ]]; then
                echo "::error::$file unexpectedly succeeded"
                cat /tmp/garnet-mvp.out
                exit 1
              fi
              if ! grep -q "BLAKE3 fingerprint mismatch" /tmp/garnet-mvp.err; then
                echo "::error::$file failed without the expected mismatch diagnostic"
                cat /tmp/garnet-mvp.err
                exit 1
              fi
              cat /tmp/garnet-mvp.err
            else
              target/debug/garnet run "$file"
            fi
            echo "::endgroup::"
          done
      - name: Self-hosted parser seed — check + run proof (S72)
        shell: bash
        run: |
          set -euo pipefail
          target/debug/garnet parse examples/self_hosted_parser_seed.garnet
          target/debug/garnet check examples/self_hosted_parser_seed.garnet
          target/debug/garnet run examples/self_hosted_parser_seed.garnet > /tmp/seed.out
          cat /tmp/seed.out
          grep -q "parsed defs: 3 managed: 1" /tmp/seed.out
          python3 scripts/garnet_self_hosted_parser_seed_status.py --gate
      - name: VM / interpreter parity campaign (S73)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/garnet_vm_interp_parity.py --gate --format md
      - name: Run dogfood and conformance phase gates
        run: |
          cargo test -p garnet-cli --test conformance_skeleton
          cargo test -p garnet-cli --test conformance_phase_gates
          cargo test -p garnet-cli --test dogfood_readiness_examples

  # ───────────────────────────────────────────────────────────────────
  # Documentation build — catches broken intra-doc links and missing
  # docs without publishing anywhere. Runs once on Linux.
  # ───────────────────────────────────────────────────────────────────
  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    needs: fmt
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-doc-
      - run: cargo doc --workspace --no-deps

  # ───────────────────────────────────────────────────────────────────
  # Machine-truth drift guard — `xtask truth --check` verifies docs/truth.json
  # and the <!-- truth:KEY --> stamped surfaces still match live repo state,
  # including the PR-1 fail-closed latest-tag certification against origin.
  # `fetch-depth: 0` so the local tags exist for that certification; the default
  # `--check` does NOT run the test suite (the `test` job owns that), so this is
  # a fast (~1s) drift gate. [Routine verification wiring — Foundation Tier-1.]
  # ───────────────────────────────────────────────────────────────────
  truth-check:
    name: machine-truth drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-truth-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-truth-
      - run: cargo run -p xtask -- truth --check
