# Garnet agentic dogfood matrix.
#
# This is the CI counterpart to the Desktop dogfood bundle generated by
# scripts/run_agentic_dogfood_matrix.py. It exercises agent-facing language,
# converter, diagnostics, release-integrity, documentation, and Garnet Studio
# workbench paths as one falsifiable readiness surface.

name: Agentic dogfood matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: agentic-dogfood-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: agentic dogfood matrix
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/garnet-studio-macos/.build
          key: ${{ runner.os }}-agentic-dogfood-${{ hashFiles('**/Cargo.lock', 'apps/garnet-studio-macos/Package.swift') }}
          restore-keys: ${{ runner.os }}-agentic-dogfood-
      - name: Run agentic dogfood matrix
        run: |
          python3 scripts/run_agentic_dogfood_matrix.py \
            --strict \
            --skip-app-workbench \
            --output-dir "$RUNNER_TEMP/garnet-agentic-dogfood"
      - name: Verify matrix manifest
        run: shasum -a 256 -c MANIFEST.sha256
        working-directory: ${{ runner.temp }}/garnet-agentic-dogfood
      - name: Upload matrix evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: garnet-agentic-dogfood-${{ github.run_id }}
          path: ${{ runner.temp }}/garnet-agentic-dogfood
          if-no-files-found: error
