name: VS Code extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-vsix:
    name: Build VSIX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Cache cargo registry + target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-vscode-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-vscode-cargo-

      - name: Build packaged VSIX
        run: ./scripts/package_garnet_vscode_extension.sh --output-dir target/vscode

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: garnet-vscode-extension-${{ matrix.os }}
          path: |
            target/vscode/*.vsix
            target/vscode/garnet-vscode-release-assets-*/README.md
            target/vscode/garnet-vscode-release-assets-*/artifact-manifest.json
            target/vscode/garnet-vscode-release-assets-*/vsix-contents.txt
            target/vscode/garnet-vscode-release-assets-*/MANIFEST.sha256
          retention-days: 30

  release-vsix:
    name: Publish VSIX release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: garnet-vscode-extension-*
          merge-multiple: true
          path: dist-vsix/

      - name: Collect VSIX assets
        run: |
          mkdir -p release-vsix
          find dist-vsix -name '*.vsix' -type f -exec cp {} release-vsix/ \;
          ls -la release-vsix

      - name: Publish VSIX assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-vsix/*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
