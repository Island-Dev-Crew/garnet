# S5: Parser fuzz harness (nightly + on-demand).
#
# Runs `cargo fuzz run parse_input` against `garnet-parser-v0.3` for ≥ 1 hour
# every night and on workflow_dispatch. The harness wraps every parser call in
# a strict ParseBudget so neither CPU nor memory can be unbounded; the goal is
# crash discovery, not coverage maximalism. Any crash uploads the offending
# input as an artifact for triage; the workflow does not silently delete or
# rewrite corpus inputs.
#
# Closes the S5 surface gap per
# F_Project_Management/GARNET_v0_5_SLICE_DOGFOOD.md § S5.

name: Parser fuzz nightly

on:
  pull_request:
    branches: [main]
  schedule:
    # 07:00 UTC daily.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Fuzz runtime in seconds"
        required: false
        default: "3600"

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo fuzz run parse_input
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '3600' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Rust nightly (cargo-fuzz requires nightly)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - name: Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            garnet-parser-v0.3/fuzz/target
          key: fuzz-nightly-${{ hashFiles('**/Cargo.lock', 'garnet-parser-v0.3/fuzz/Cargo.toml') }}
      - name: Install cargo-fuzz
        # cargo-fuzz's published lockfile can lag current nightly toolchains; pin
        # the cargo-fuzz release while allowing compatible transitive fixes.
        run: cargo install cargo-fuzz --version 0.13.1
      - name: Sub-workspace structural sanity
        working-directory: garnet-parser-v0.3/fuzz
        run: cargo metadata --no-deps > /dev/null
      - name: Run fuzz target
        working-directory: garnet-parser-v0.3/fuzz
        run: |
          set -eu
          # If a crash occurs, cargo fuzz returns non-zero and the artifact upload below
          # captures the offending input. Otherwise the run terminates cleanly after
          # MAX_TOTAL_TIME seconds.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            max_total_time=60
          else
            max_total_time="${MAX_TOTAL_TIME}"
          fi
          cargo +nightly fuzz run parse_input -- -max_total_time="${max_total_time}"
      - name: Upload crash inputs (if any)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fuzz-crash-inputs
          path: garnet-parser-v0.3/fuzz/artifacts/
          retention-days: 30
      - name: Upload corpus snapshot for inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fuzz-corpus-snapshot
          path: garnet-parser-v0.3/fuzz/corpus/
          retention-days: 7
