name: Web PWA Readiness

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/smoke_garnet_web_pwa.sh"
      - "scripts/smoke_garnet_web_pwa_offline.mjs"
      - "scripts/smoke_garnet_pages_pwa.sh"
      - "scripts/test_smoke_garnet_pages_pwa.py"
      - ".github/workflows/web-pwa-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/smoke_garnet_web_pwa.sh"
      - "scripts/smoke_garnet_web_pwa_offline.mjs"
      - "scripts/smoke_garnet_pages_pwa.sh"
      - "scripts/test_smoke_garnet_pages_pwa.py"
      - ".github/workflows/web-pwa-readiness.yml"

jobs:
  web-pwa-readiness:
    name: Garnet web PWA smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify docs PWA surface
        run: scripts/smoke_garnet_web_pwa.sh --strict

      - name: Verify live Pages smoke regression contract
        run: python3 scripts/test_smoke_garnet_pages_pwa.py

      - name: Upload PWA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: garnet-web-pwa-${{ github.run_id }}
          path: target/web-pwa-readiness-*
          if-no-files-found: warn
