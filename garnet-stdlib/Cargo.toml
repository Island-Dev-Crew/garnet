[package]
name = "garnet-stdlib"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["Island Development Crew"]
license = "MIT OR Apache-2.0"
description = "Garnet standard library — P0 primitives for OS, network, time, strings, crypto. Each subsystem is gated on its paired Security Layer 2 defense (CapCaps, NetDefaults, BoundedMail, ManifestSig)."

[dependencies]
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
# S17 (v0.7) stdlib expansion. serde_json/regex/rand are already in the
# workspace lockfile; sha1 is the RustCrypto sibling of sha2 (used by std::uuid v5).
serde_json = "1"
regex = "1"
rand = "0.8"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
