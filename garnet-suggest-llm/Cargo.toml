[package]
name = "garnet-suggest-llm"
version = "0.1.0"
edition = "2021"
description = "Feature-gated, non-deterministic LLM advisory tier for Garnet compiler suggestions."
license = "MIT OR Apache-2.0"

[features]
default = []
llm = []

[lib]
name = "garnet_suggest_llm"
path = "src/lib.rs"

[dependencies]
blake3 = "1.5"
garnet-check = { path = "../garnet-check-v0.3" }
garnet-parser = { path = "../garnet-parser-v0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
