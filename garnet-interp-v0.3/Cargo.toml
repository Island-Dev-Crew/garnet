[package]
name = "garnet-interp"
version = "0.3.0"
edition = "2021"
description = "Managed-mode tree-walk interpreter for Garnet v0.3 (Rung 3)."
license = "MIT OR Apache-2.0"

[dependencies]
garnet-parser = { version = "0.3.0", path = "../garnet-parser-v0.3" }
garnet-memory = { version = "0.3.0", path = "../garnet-memory-v0.3" }
garnet-stdlib = { version = "0.4.0", path = "../garnet-stdlib" }
# RB-3: registry-derived dispatch macros (version pin is policy-required).
garnet-prim-macros = { version = "0.1.0", path = "../garnet-prim-macros" }
miette = { version = "7.6", features = ["fancy"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
# S21 — Mnemos × stdlib combination smoke (both are normal deps; declared here
# so the integration test in `tests/` can use them directly).
garnet-memory = { version = "0.3.0", path = "../garnet-memory-v0.3" }
garnet-stdlib = { version = "0.4.0", path = "../garnet-stdlib" }

[[bench]]
name = "eval"
harness = false
