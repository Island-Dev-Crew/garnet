[project]
name = "{{name}}"
version = "0.1.0"
edition = "v1.0"
description = "A Garnet HTTP/1.1 API service"

[build]
mode = "managed"

[caps]
# The budget the service is meant to use; nothing reads this list yet.
# `net` for the listener you write, `time` for deadlines. If the service
# reads config files, add "fs" here and annotate the reader with @caps(fs).
allowed = ["net", "time"]

[[bin]]
name = "{{name}}"
path = "src/main.garnet"
