[project]
name = "{{name}}"
version = "0.1.0"
edition = "v1.0"
description = "A Garnet multi-actor agent orchestrator (Researcher / Synthesizer / Reviewer)"

[build]
mode = "managed"

[caps]
# The starter holds only memory authority: each actor declares a memory tier,
# and a `memory` declaration is gated under `mem` (ADR 0011). No host
# authority; add time/fs/net as the project grows into persisted traces or
# services.
allowed = ["mem"]

[[bin]]
name = "{{name}}"
path = "src/main.garnet"
