[package]
name = "xtask"
version = "0.3.2"
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Workspace task runner — 7\u00d7 consistency harness, etc. Not part of the published crates."
publish = false

[dependencies]
# RB-0a truth generator: primitive_count/primitives_by_layer come straight
# from all_prims() — machine truth, not a re-typed number. Version pin is
# policy-required (cargo-deny bans wildcard internal path deps).
garnet-stdlib = { path = "../garnet-stdlib", version = "0.4.0" }
serde_json = "1"
