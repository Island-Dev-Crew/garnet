[workspace]
resolver = "2"
members = [
    "garnet-parser-v0.3",
    "garnet-interp-v0.3",
    "garnet-check-v0.3",
    "garnet-memory-v0.3",
    "garnet-cli",
    "garnet-actor-runtime",
    "garnet-stdlib",
    "garnet-suggest-llm",
    "garnet-convert",
    "garnet-cst",
    "garnet-lsp",
    "garnet-vm",
    "garnet-wasm",
    "garnet-registry-stub",
    "garnet-prim-macros",
    "xtask",
]
# Exclude the archived v0.2 parser (flat-file layout, retained at
# `archive/garnet-parser-v0.2/` for audit trail only — superseded by
# `garnet-parser-v0.3/`).
exclude = ["archive/garnet-parser-v0.2", "apps/garnet-studio/src-tauri"]

# The user-facing Garnet release version. The `garnet` CLI binary (in
# `garnet-cli/`) is the canonical public version surface and inherits this value
# via `version.workspace = true`, so it stays in genuine lockstep; individual
# library crates carry their own `[package] version` to allow independent semver
# as their public APIs stabilize.
[workspace.package]
version = "0.8.2"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Island Development Crew"]
repository = "https://github.com/Island-Dev-Crew/garnet"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
